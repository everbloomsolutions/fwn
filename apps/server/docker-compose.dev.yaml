# Docker Compose configuration for Development
name: fwn
# Usage: docker-compose -f docker-compose.dev.yaml up -d
# Or: podman-compose -f docker-compose.dev.yaml up -d

services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: fwn-redis
    ports:
      - "6380:6379"
    volumes:
      - fwn-redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - fwn-network

  # MongoDB service for development
  mongo:
    image: mongo:7
    container_name: fwn-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: fwn
    volumes:
      - fwn-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fwn-network

volumes:
  fwn-redis-data:
    driver: local
  fwn-mongo-data:
    driver: local

networks:
  fwn-network:
    driver: bridge

