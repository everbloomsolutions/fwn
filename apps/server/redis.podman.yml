# Podman Pod definition for Redis
# Usage: podman play kube redis.podman.yml

apiVersion: v1
kind: Pod
metadata:
  name: server-redis-pod
  labels:
    app: server
    component: redis
spec:
  containers:
    - name: redis
      image: docker.io/library/redis:7-alpine
      ports:
        - containerPort: 6379
          hostPort: 6379
          protocol: TCP
      volumeMounts:
        - name: redis-data
          mountPath: /data
      command:
        - redis-server
        - --appendonly
        - "yes"
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      livenessProbe:
        exec:
          command:
            - redis-cli
            - ping
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        exec:
          command:
            - redis-cli
            - ping
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
  volumes:
    - name: redis-data
      type: volume
      source: server-redis-data

---
# Persistent Volume for Redis data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

